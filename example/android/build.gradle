buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        // Bumped from the RN template default of 21 to 28 because the
        // UseSense native Android SDK declares `minSdk = 28` in its
        // own build.gradle.kts, and AGP fails the app build if the
        // consumer's minSdkVersion is lower than any transitive
        // library's minSdk (AAR metadata mismatch error).
        minSdkVersion = 28
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        // Kotlin 2.2.10 is required (not just preferred) because the
        // UseSense Android SDK 4.2.1 AAR was compiled with Kotlin 2.2
        // and declares `kotlin-stdlib:2.2.10` as a transitive runtime
        // dependency. Gradle resolves version conflicts by picking the
        // higher version, so `kotlin-stdlib-2.2.10.jar` ends up on the
        // compile classpath of every Kotlin task in the build — no
        // matter what we put here. The Kotlin 1.8 compiler cannot read
        // 2.2 stdlib metadata, so we must upgrade the compiler to match.
        //
        // IMPORTANT: `ext.kotlinVersion` by itself does NOT change the
        // kotlin-gradle-plugin version on the classpath — it's only
        // used for templating into the classpath declaration below.
        // Without that explicit pin, `classpath("...kotlin-gradle-plugin")`
        // falls through to RN 0.73's transitive default of 1.8.0, and
        // you end up with a 1.8 compiler reading a 2.2 stdlib.
        kotlinVersion = "2.2.10"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        // Explicit pin — see the comment on `kotlinVersion` above.
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

// Pin the Kotlin source language + API level to 1.9 for every subproject.
// Rationale: the Kotlin 2.2 compiler defaults to language version 2.2, which
// enables the K2 frontend and drops some deprecated syntax that older RN
// native modules (react-native-screens, react-native-safe-area-context,
// react-native-gesture-handler, etc.) were written against. Those modules
// ship Kotlin 1.x sources that Gradle compiles fresh from source in the
// consumer's build, so if we let the 2.2 compiler run at its default
// language level, their sources fail to compile. Pinning languageVersion
// and apiVersion to 1.9 tells the 2.2 compiler to accept 1.9-era syntax
// and emit 1.9-compatible metadata for those modules while still being
// able to READ the UseSense SDK's 2.2 metadata (Kotlin metadata is
// forward-readable).
subprojects {
    afterEvaluate {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                languageVersion = "1.9"
                apiVersion = "1.9"
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
