name: usesense_flutter
description: >
  Flutter plugin for UseSense — human presence verification with DeepSense
  (device integrity), LiveSense (proof-of-life), and Dedupe (identity collision detection).
version: 0.1.0
homepage: https://usesense.com
repository: https://github.com/qudusadeyemi/usesense-flutter

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^22.7.0

flutter:
  plugin:
    platforms:
      android:
        package: com.usesense.flutter
        pluginClass: UseSenseFlutterPlugin
      ios:
        pluginClass: UseSenseFlutterPlugin
