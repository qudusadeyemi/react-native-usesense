buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        // Bumped from the RN template default of 21 to 28 because the
        // UseSense native Android SDK declares `minSdk = 28` in its
        // own build.gradle.kts, and AGP fails the app build if the
        // consumer's minSdkVersion is lower than any transitive
        // library's minSdk (AAR metadata mismatch error).
        minSdkVersion = 28
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        // Bumped from the RN template default of 1.8.0 to match the
        // native SDK's Kotlin version (2.2.10 per its root
        // build.gradle.kts). Keeping the example on Kotlin 1.8 while
        // consuming a library built with Kotlin 2.2 produces a
        // "metadata version not compatible" warning and can break
        // ktlint + kapt pipelines.
        kotlinVersion = "2.2.10"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
