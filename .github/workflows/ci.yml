name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build-ios:
    name: Build iOS Example
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install plugin dependencies
        run: npm ci --ignore-scripts

      - name: Build plugin (typescript → lib/)
        # The example's `file:..` dep resolves to the plugin's `main`
        # field (`lib/commonjs/index.js`), which doesn't exist until
        # the plugin has been built. Without this step, `npm install`
        # inside example/ hoists a broken install.
        run: npm run build

      - name: Install example dependencies
        working-directory: example
        run: npm install --legacy-peer-deps

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: example

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: example/ios
        run: pod install --repo-update

      - name: Build iOS example
        working-directory: example/ios
        # CODE_SIGNING_ALLOWED=NO skips signing (CI has no team ID).
        # `xcpretty` is provided by the macos-14 runner image by default.
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace UseSenseExample.xcworkspace \
            -scheme UseSenseExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

  build-android:
    name: Build Android Example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install plugin dependencies
        run: npm ci --ignore-scripts

      - name: Build plugin (typescript → lib/)
        run: npm run build

      - name: Install example dependencies
        working-directory: example
        run: npm install --legacy-peer-deps

      - name: Gradle build
        working-directory: example/android
        run: ./gradlew assembleDebug --stacktrace
