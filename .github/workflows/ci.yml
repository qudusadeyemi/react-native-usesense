name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build-ios:
    name: Build iOS Example
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install plugin dependencies
        run: npm ci --ignore-scripts

      - name: Build plugin (typescript → lib/)
        # The example's `file:..` dep resolves to the plugin's `main`
        # field (`lib/commonjs/index.js`), which doesn't exist until
        # the plugin has been built. Without this step, `npm install`
        # inside example/ hoists a broken install.
        run: npm run build

      - name: Install example dependencies
        working-directory: example
        run: npm install --legacy-peer-deps

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: example

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: example/ios
        # `pod install` honours the committed Podfile.lock and fails when the dev
        # pod (react-native-usesense) has bumped its UseSenseSDK constraint past the
        # locked version (CocoaPods refuses to bump a locked pod on `install`). Fall
        # back to updating just the UseSense pods so the example always resolves the
        # SDK version the podspec requires (`~> 4.x`) and the iOS bridge gets compiled.
        run: pod install --repo-update || pod update UseSenseSDK --repo-update

      - name: Build iOS example
        working-directory: example/ios
        # CODE_SIGNING_ALLOWED=NO skips signing (CI has no team ID).
        # `xcbeautify` is preinstalled on the macos-14 runner image and
        # is the current-generation replacement for `xcpretty` (which
        # was removed from the image — the first bootstrap run failed
        # with `xcpretty: command not found` / exit 127 at the start
        # of this step and the rest of the build wrote into a dead
        # pipe for 11 minutes before the shell finally returned).
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace UseSenseExample.xcworkspace \
            -scheme UseSenseExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

  build-android:
    name: Build Android Example (release)
    # Why a freshly-scaffolded app instead of the committed example/android:
    # the committed example is pinned to React Native 0.73, whose
    # @react-native/gradle-plugin is built against the Kotlin 1.8 Gradle DSL and
    # is fundamentally incompatible with the Kotlin-2.x-compiled ai.usesense:sdk
    # (neither a resolutionStrategy pin nor a kotlinVersion bump bridges the
    # KotlinTopLevelExtension class→interface ABI break — see this file's git
    # history for the full analysis). RN >= 0.76 is the first release with a
    # Kotlin-2.x gradle plugin.
    #
    # Rather than freeze a re-scaffolded 0.76 example in the repo, generate a
    # fresh app on a modern RN in CI, install THIS plugin into it (via `npm pack`,
    # so only the published artifact is used), and build a RELEASE APK. The
    # release variant runs the strict application manifest merge — the only place
    # SDK-level defects (transitive namespace collisions, minSdk mismatches)
    # surface. Building only the library or a debug app lets that class ship.
    runs-on: ubuntu-latest
    env:
      RN_VERSION: '0.76.5'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and pack the plugin
        # `npm pack` respects package.json `files`, so the tarball is exactly the
        # published artifact (lib/ + android/ + podspec, no node_modules).
        run: |
          npm ci --ignore-scripts
          npm run build
          npm pack

      - name: Scaffold a fresh RN app and install the plugin
        run: |
          set -euxo pipefail
          TGZ="$(ls "$GITHUB_WORKSPACE"/react-native-usesense-*.tgz)"
          cd "$RUNNER_TEMP"
          npx --yes @react-native-community/cli@latest init GuardApp \
            --version "$RN_VERSION" --skip-install --skip-git-init --pm npm
          cd GuardApp
          npm install
          npm install "$TGZ"
          # ai.usesense:sdk requires minSdk 28; raise the app floor to match so
          # the release manifest merge succeeds (integrators must do the same).
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 28/' android/build.gradle
          # ai.usesense:sdk is compiled with Kotlin 2.2.10 (metadata 2.2.0). RN
          # 0.76 defaults to Kotlin 1.9.x, whose compiler can only read metadata
          # up to 2.0.0, so it fails reading the SDK's classes. Bump the app's
          # Kotlin Gradle Plugin to match the SDK. Integrators on RN 0.76+ must
          # set the same `kotlinVersion` in android/build.gradle.
          sed -i -E 's/kotlinVersion = "[0-9.]+"/kotlinVersion = "2.2.10"/' android/build.gradle
          # Disable the New Architecture for this guard: our native module is a
          # plain (old-arch) module with no Fabric/TurboModule C++, so New Arch
          # only adds a CMake/NDK codegen build we don't exercise. This keeps the
          # guard focused on the Kotlin/manifest layer where SDK issues surface.
          sed -i -E 's/newArchEnabled=true/newArchEnabled=false/' android/gradle.properties

      - name: Build release APK
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/GuardApp/android"
          ./gradlew assembleRelease --stacktrace
