buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        // Bumped from the RN template default of 21 to 28 because the
        // UseSense native Android SDK declares `minSdk = 28` in its
        // own build.gradle.kts, and AGP fails the app build if the
        // consumer's minSdkVersion is lower than any transitive
        // library's minSdk (AAR metadata mismatch error).
        minSdkVersion = 28
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        // Pinned to the RN 0.73 template default of 1.8.0. The
        // `@react-native/gradle-plugin` shipped with RN 0.73 hardcodes
        // its own Kotlin compiler at 1.8.0 and ignores `ext.kotlinVersion`,
        // so bumping this to match the UseSense SDK's 2.2.x produces a
        // 1.8 compiler reading a 2.2 stdlib — a fatal metadata version
        // mismatch that breaks `react-native-safe-area-context` and
        // every other transitively-compiled Kotlin dep. The UseSense
        // AAR compiled against Kotlin 2.2 is binary-compatible with a
        // 1.8 consumer (Kotlin's stdlib promises this), so the right
        // fix is to keep compiler + stdlib in sync on 1.8 and tolerate
        // a non-fatal metadata warning on the UseSense class files.
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
