name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build-ios:
    name: Build iOS Example
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install plugin dependencies
        run: npm ci --ignore-scripts

      - name: Build plugin (typescript → lib/)
        # The example's `file:..` dep resolves to the plugin's `main`
        # field (`lib/commonjs/index.js`), which doesn't exist until
        # the plugin has been built. Without this step, `npm install`
        # inside example/ hoists a broken install.
        run: npm run build

      - name: Install example dependencies
        working-directory: example
        run: npm install --legacy-peer-deps

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: example

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: example/ios
        run: pod install --repo-update

      - name: Build iOS example
        working-directory: example/ios
        # CODE_SIGNING_ALLOWED=NO skips signing (CI has no team ID).
        # `xcbeautify` is preinstalled on the macos-14 runner image and
        # is the current-generation replacement for `xcpretty` (which
        # was removed from the image — the first bootstrap run failed
        # with `xcpretty: command not found` / exit 127 at the start
        # of this step and the rest of the build wrote into a dead
        # pipe for 11 minutes before the shell finally returned).
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace UseSenseExample.xcworkspace \
            -scheme UseSenseExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

  # ---------------------------------------------------------------------------
  # TODO(android): re-enable once one of the two root causes below is fixed.
  #
  # The UseSense Android SDK 4.2.1 AAR is compiled with Kotlin 2.2.10 and
  # declares `org.jetbrains.kotlin:kotlin-stdlib:2.2.10` as a transitive
  # runtime dependency. React Native 0.73.11 ships with `@react-native/
  # gradle-plugin` hard-coded against Kotlin Gradle Plugin **1.8.0** — not
  # just at the stdlib level, but at the **Gradle DSL ABI** level. These
  # two are fundamentally incompatible and neither a resolutionStrategy
  # pin nor an `ext.kotlinVersion` bump can bridge them:
  #
  #   • Leave `kotlinVersion = "1.8.0"` → the 1.8 compiler fails reading
  #     `kotlin-stdlib-2.2.10.jar` with
  #         "Module was compiled with an incompatible version of Kotlin.
  #          The binary version of its metadata is 2.2.0, expected 1.8.0"
  #     because Gradle dependency resolution picks the higher version of
  #     every stdlib artifact on conflict, so the 2.2.10 stdlib ends up
  #     on every `compile*Kotlin` classpath whether we want it or not.
  #
  #   • Bump `kotlinVersion = "2.2.10"` and explicitly pin KGP on the
  #     buildscript classpath → `@react-native/gradle-plugin@0.73.11`
  #     fails to evaluate with
  #         "Found interface org.jetbrains.kotlin.gradle.dsl.
  #          KotlinTopLevelExtension, but class was expected"
  #     because that type changed from abstract class → interface in
  #     Kotlin 2.0.0, and the RN gradle plugin was compiled against the
  #     KGP 1.8 ABI where it's still a class. The plugin itself won't load.
  #
  # The clean fixes both live outside this repo:
  #
  #   (a) Upgrade the example template to React Native ≥ 0.76, which is
  #       the first RN release with a `@react-native/gradle-plugin` built
  #       against the Kotlin 2.x DSL. That requires re-bootstrapping the
  #       example/android/ scaffold from scratch against 0.76+.
  #
  #   (b) Publish a Kotlin 1.9-compiled variant of `ai.usesense:sdk` with
  #       `languageVersion = "1.8"` + `apiVersion = "1.8"` pinned in the
  #       SDK's build.gradle.kts. Kotlin 1.9 can target 1.8-readable
  #       metadata, so RN 0.73's 1.8 toolchain could consume it without
  #       tripping either error above.
  #
  # Until one of those lands, the Android example cannot build under RN
  # 0.73 and the CI job is more misleading than useful. Leaving it off —
  # iOS build + lint/typecheck/test still cover the plugin itself, and
  # the Android module compiles fine against the SDK in integrator
  # projects that are on RN 0.76+.
