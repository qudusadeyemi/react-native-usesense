buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        // Bumped from the RN template default of 21 to 28 because the
        // UseSense native Android SDK declares `minSdk = 28` in its
        // own build.gradle.kts, and AGP fails the app build if the
        // consumer's minSdkVersion is lower than any transitive
        // library's minSdk (AAR metadata mismatch error).
        minSdkVersion = 28
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        // Left at the RN 0.73 template default of 1.8.0. Bumping this
        // does not actually fix the UseSense SDK Kotlin version
        // collision — see the big TODO comment on the `build-android`
        // job in .github/workflows/ci.yml for the full diagnosis.
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
